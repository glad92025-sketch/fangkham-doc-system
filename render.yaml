services:
  - type: web
    name: fangkham-doc-system
    env: docker
    plan: starter
    region: singapore
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_NAME
        value: "อบต.ฝางคำ - ระบบจัดเก็บเอกสาร"
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromService:
          type: web
          name: fangkham-doc-system
          property: url
      - key: DATABASE_URL
        fromDatabase:
          name: fangkham-db
          property: connectionString
      - key: GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON
        value: /etc/secrets/google-service-account.json
    secretFiles:
      - name: google-service-account.json
        mountPath: /etc/secrets/google-service-account.json

databases:
  - name: fangkham-db
    plan: starter
    region: singapore
    databaseName: fangkham
    user: fangkham_user
